<style>*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;scroll-behavior:smooth;transition:0.3s;background:#f5f5f5;color:#121212;}
a{text-decoration:none;color:inherit;}
ul{list-style:none;}

/* VARIABLES */
:root{
  --grad-start:#6a11cb;
  --grad-end:#2575fc;
  --bg-light:#f5f5f5;
  --bg-dark:#121212;
  --text-light:#121212;
  --text-dark:#f5f5f5;
}

/* DARK/LIGHT MODE */
body.light-mode{background:var(--bg-light);color:var(--text-light);}
body.dark-mode{background:var(--bg-dark);color:var(--text-dark);}

/* NAVBAR */
nav{
  position:fixed;top:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:1rem 2rem;background:linear-gradient(90deg,var(--grad-start),var(--grad-end));color:white;z-index:1000;box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
nav .logo{font-weight:bold;font-size:1.5rem;letter-spacing:1px;cursor:pointer;}
nav ul{display:flex;gap:1.5rem;}
nav ul li{cursor:pointer;transition:0.3s;}
nav ul li:hover{opacity:0.7;}
nav .mode-toggle{cursor:pointer;font-size:1.4rem;transition:0.3s;}

/* HERO */
#hero{
  height:100vh;background:linear-gradient(135deg,var(--grad-start),var(--grad-end));
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white;position:relative;
}
#hero h1{font-size:3rem;margin-bottom:1rem;text-shadow:2px 2px 10px rgba(0,0,0,0.4);}
#hero p{font-size:1.3rem;margin-bottom:2rem;max-width:800px;line-height:1.5;text-shadow:1px 1px 6px rgba(0,0,0,0.4);}
#hero button{
  padding:1rem 2rem;font-size:1.2rem;font-weight:bold;border:none;border-radius:50px;cursor:pointer;
  background:linear-gradient(90deg,#ff416c,#ff4b2b);color:white;box-shadow:0 5px 20px rgba(0,0,0,0.3);
  transition:0.3s;
}
#hero button:hover{transform:translateY(-5px);box-shadow:0 10px 25px rgba(0,0,0,0.4);}

/* SECTIONS */
section{padding:100px 20px 60px 20px;min-height:100vh;display:none;opacity:0;transition:0.5s;}
section.active{display:block;opacity:1;}
section h2{text-align:center;margin-bottom:2rem;font-size:2.2rem;position:relative;}
section h2::after{content:"";width:60px;height:4px;background:linear-gradient(90deg,var(--grad-start),var(--grad-end));display:block;margin:10px auto 0;border-radius:2px;}

/* CARDS */
.cards, .steps{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;}
.card, .step-card{
  background:linear-gradient(135deg,#6a11cb,#2575fc);color:white;padding:1.5rem 2rem;border-radius:20px;
  min-width:280px;transition:0.6s;box-shadow:0 8px 25px rgba(0,0,0,0.3);opacity:0;transform:translateY(40px);
}
.card.show, .step-card.show{opacity:1;transform:translateY(0);}
.card:hover, .step-card:hover{transform:translateY(-8px);opacity:0.95;box-shadow:0 12px 35px rgba(0,0,0,0.4);}

/* LANGUAGE SELECT */
.select-language{margin-bottom:2rem;display:flex;justify-content:center;}
select{padding:0.7rem 1.2rem;border-radius:15px;border:none;outline:none;font-weight:bold;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.2);}

/* RETURN BUTTON */
.return-btn{
  display:block;margin:2rem auto 0 auto;padding:0.8rem 2rem;border:none;border-radius:50px;
  background:linear-gradient(90deg,#ff416c,#ff4b2b);color:white;font-weight:bold;cursor:pointer;transition:0.3s;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
}
.return-btn:hover{transform:translateY(-5px);box-shadow:0 10px 25px rgba(0,0,0,0.4);}

/* BOT LINK SECTION */
.bot-link-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
  margin-top: 2rem;
}

.bot-link {
  font-size: 1.2rem;
  background: white;
  padding: 1rem 2rem;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  color: #121212;
  text-align: center;
  word-break: break-all;
}

.copy-btn {
  padding: 0.8rem 1.5rem;
  font-size: 1rem;
  font-weight: bold;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  background: linear-gradient(90deg, #6a11cb, #2575fc);
  color: white;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  transition: 0.3s;
}

.copy-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.copy-btn.copied {
  background: linear-gradient(90deg, #00b09b, #96c93d);
}

/* FOOTER */
footer{background:linear-gradient(90deg,#6a11cb,#2575fc);color:white;padding:1rem 0;text-align:center;font-size:0.95rem;position:relative;}
footer a{color:white;margin-left:0.5rem;}

/* RESPONSIVE */
@media(max-width:768px){.cards,.steps{flex-direction:column;align-items:center;}}

function toggleMode(){
  document.body.classList.toggle('dark-mode');
  document.body.classList.toggle('light-mode');
  document.querySelector('.mode-toggle').textContent = document.body.classList.contains('dark-mode') ? '🌙' : '☀️';
}

/* SPA SHOW SECTION */
function showSection(id){
  document.querySelectorAll('section').forEach(sec=>{
    sec.classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
}

/* ABOUT TEXTS */
const aboutTexts = {
  ar:`سبام بوت هو نظام ذكي متطور يتيح للمستخدمين إرسال الرسائل النصية أو الصورية بشكل متكرر ودقيق عبر معرفات المستخدمين.\n\nتم تصميمه ليكون سريع، آمن، وسهل الاستخدام، مع دعمٍ لأكثر من 10 لغات مختلفة لتوفير تجربة شاملة ومريحة.\n\nقبل استخدام البوت، يجب على المستخدم توثيق نفسه أولاً، ثم إدخال كلمة المرور الخاصة بالاستخدام لضمان الأمان ومنع أي استخدام غير مصرح به.\nكما يرسل البوت الرسائل فقط إلى المستخدمين الذين سبق أن تفاعلوا معه سابقًا، حفاظًا على الخصوصية ومنع الإزعاج.\n\nيُعد هذا البوت أداة احترافية مثالية لتنظيم التواصل والإرسال الجماعي داخل تليجرام بكفاءة عالية.`,
  en:`Spam Bot is an advanced smart system that allows users to send text or image messages repeatedly and accurately via user IDs.\n\nIt is designed to be fast, secure, and easy to use, supporting more than 10 different languages for a comprehensive experience.\n\nBefore using the bot, the user must first verify themselves, then enter the usage password to ensure security and prevent unauthorized use.\nThe bot sends messages only to users who have previously interacted with it, preserving privacy and preventing spam.\n\nThis bot is a professional tool ideal for organizing communication and mass sending on Telegram efficiently.`,
  es:`Spam Bot es un sistema inteligente avanzado que permite a los usuarios enviar mensajes de texto o imágenes de manera repetida y precisa a través de IDs de usuario.\n\nEstá diseñado para ser rápido, seguro y fácil de usar, con soporte para más de 10 idiomas diferentes para una experiencia completa.\n\nAntes de usar el bot, el usuario debe verificarse primero, luego ingresar la contraseña de uso para garantizar la seguridad y prevenir el uso no autorizado.\nEl bot envía mensajes solo a los usuarios que han interactuado previamente, preservando la privacidad y evitando spam.\n\nEste bot es una herramienta profesional ideal para organizar la comunicación y el envío masivo en Telegram de manera eficiente.`,
  de:`Spam Bot ist ein fortschrittliches intelligentes System, das es Benutzern ermöglicht, Text- oder Bildnachrichten wiederholt und genau über Benutzer-IDs zu senden.\n\nEs ist so konzipiert, dass es schnell, sicher und einfach zu bedienen ist und mehr als 10 verschiedene Sprachen für ein umfassendes Erlebnis unterstützt.\n\nBevor der Bot verwendet wird, muss sich der Benutzer zuerst verifizieren und dann das Nutzungspasswort eingeben, um Sicherheit und unbefugte Nutzung zu verhindern.\nDer Bot sendet Nachrichten nur an Benutzer, die zuvor mit ihm interagiert haben, um Privatsphäre zu wahren und Spam zu verhindern.\n\nDieser Bot ist ein professionelles Werkzeug, ideal zur Organisation von Kommunikation und Massenversand auf Telegram.`,
  it:`Spam Bot è un sistema intelligente avanzato che consente agli utenti di inviare messaggi di testo o immagini in modo ripetuto e preciso tramite ID utente.\n\nÈ progettato per essere veloce, sicuro e facile da usare, supportando più di 10 lingue diverse per un'esperienza completa.\n\nPrima di utilizzare il bot, l'utente deve prima verificarsi e poi inserire la password d'uso per garantire la sicurezza e prevenire usi non autorizzati.\nIl bot invia messaggi solo agli utenti che hanno già interagito con esso, preservando la privacy e prevenendo lo spam.\n\nQuesto bot è uno strumento professionale ideale per organizzare la comunicazione e l'invio di massa su Telegram in modo efficiente.`,
  fr:`Spam Bot est un système intelligent avancé qui permet aux utilisateurs d'envoyer des messages texte ou image de manière répétée et précise via des ID utilisateurs.\n\nIl est conçu pour être rapide, sûr et facile à utiliser, prenant en charge plus de 10 langues différentes pour une expérience complète.\n\nAvant d'utiliser le bot, l'utilisateur doit d'abord se vérifier, puis entrer le mot de passe d'utilisation pour assurer la sécurité et empêcher tout usage non autorisé.\nLe bot n'envoie des messages qu'aux utilisateurs ayant déjà interagi avec lui, préservant la confidentialité et évitant le spam.\n\nCe bot est un outil professionnel idéal pour organiser la communication et l'envoi en masse sur Telegram efficacement.`,
  ru:`Spam Bot — это продвинутая умная система, позволяющая пользователям отправлять текстовые или графические сообщения многократно и точно через ID пользователей.\n\nОн разработан, чтобы быть быстрым, безопасным и простым в использовании, поддерживая более 10 разных языков для полноценного опыта.\n\nПеред использованием бота пользователь должен сначала пройти верификацию, затем ввести пароль для обеспечения безопасности и предотвращения несанкционированного использования.\nБот отправляет сообщения только пользователям, которые ранее взаимодействовали с ним, сохраняя конфиденциальность и предотвращая спам.\n\nЭтот бот является профессиональным инструментом, идеально подходящим для организации общения и массовой рассылки в Telegram.`,

/* UPDATE ALL TEXT CONTENT */
function updateAllTexts(lang = 'ar') {
  // Update navigation
  document.querySelectorAll('[data-key]').forEach(element => {
    const key = element.getAttribute('data-key');
    if (translations[lang] && translations[lang][key]) {
      element.textContent = translations[lang][key];
    }
  });
  
  // Update language selectors
  document.querySelectorAll('select').forEach(select => {
    select.value = lang;
  });
}

/* POPULATE ABOUT */
function populateAbout(lang='ar'){
  const container=document.getElementById('aboutCards');
  container.innerHTML='';
  const paragraphs = aboutTexts[lang].split('\n\n');
  paragraphs.forEach(p=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`<p>${p}</p>`;
    container.appendChild(card);
  });
  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){entry.target.classList.add('show');}
    });
  }, {threshold:0.2});
  document.querySelectorAll('.card').forEach(card=>observer.observe(card));
}

/* CHANGE LANGUAGE */
function changeLanguage(){
  const lang = document.getElementById('langSelect').value;
  populateAbout(lang);
  updateAllTexts(lang);
}

/* POPULATE STEPS */
function populateSteps(lang='ar'){
  const container=document.getElementById('stepsContainer');
  container.innerHTML='';
  const steps = stepsTexts[lang] || stepsTexts['ar'];
  steps.forEach(s=>{
    const step=document.createElement('div');
    step.className='step-card';
    step.innerHTML=`<p>${s}</p>`;
    container.appendChild(step);
  });
  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){entry.target.classList.add('show');}
    });
  }, {threshold:0.2});
  document.querySelectorAll('.step-card').forEach(step=>observer.observe(step));
}

/* CHANGE STEPS LANGUAGE */
function changeStepsLanguage(){
  const lang = document.getElementById('langSelectHow').value;
  populateSteps(lang);
  updateAllTexts(lang);
}

/* CHANGE BOT LINK LANGUAGE */
function changeBotLinkLanguage(){
  const lang = document.getElementById('langSelectBotLink').value;
  updateAllTexts(lang);
}

/* COPY BOT LINK */
function copyBotLink() {
  const link = 'https://t.me/ali_spam_bot';
  navigator.clipboard.writeText(link).then(() => {
    const copyBtn = document.querySelector('.copy-btn');
    const originalText = copyBtn.textContent;
    copyBtn.textContent = translations[currentLang]?.copiedBtn || 'تم النسخ!';
    copyBtn.classList.add('copied');
    
    setTimeout(() => {
      copyBtn.textContent = originalText;
      copyBtn.classList.remove('copied');
    }, 2000);
  });
}
